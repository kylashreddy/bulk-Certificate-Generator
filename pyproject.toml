[project]
name = "bulk-certificate-generator"
version = "1.0.0"
description = "Bulk certificate generation API: one request, many recipients, one PDF each."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "reportlab>=4.2",
    "rl_accel>=0.9",  # ReportLab's optional C speedups (number formatting in paths)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "pypdf>=4.2",
    "pypdfium2>=4.30",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["certgen*"]

[tool.setuptools.package-data]
# Non-Python files the app needs at runtime: Alembic scripts and the bundled fonts.
"certgen" = ["migrations/*.py", "migrations/*.mako", "migrations/versions/*.py"]
"certgen.rendering" = ["assets/fonts/*.ttf", "assets/fonts/licenses/*.txt"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI's Depends()/Query() in defaults is the framework idiom

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # Newer Starlette nudges towards httpx2; the assignment specifies httpx, which still works.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
